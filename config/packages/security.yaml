security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: form_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: app_login
                check_path: app_login
                success_handler: App\Security\LoginSuccessHandler
            json_login:
                check_path: /api/login
                username_path: email
                password_path: motDePasse
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 7 jours
                always_remember_me: true

    # Règles d'accès par rôle
    access_control:
        - { path: ^/login,            roles: PUBLIC_ACCESS }
        - { path: ^/inscription,      roles: PUBLIC_ACCESS }
        - { path: ^/api/login,        roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription,  roles: PUBLIC_ACCESS }
        - { path: ^/api/devis,        roles: PUBLIC_ACCESS }
        - { path: ^/admin,            roles: ROLE_ADMINISTRATEUR }
        - { path: ^/intervenant,      roles: ROLE_INTERVENANT }
        - { path: ^/beneficiaire,     roles: ROLE_BENEFICIAIRE }
        - { path: ^/api/intervenant,  roles: ROLE_INTERVENANT }
        - { path: ^/api/beneficiaire, roles: ROLE_BENEFICIAIRE }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
